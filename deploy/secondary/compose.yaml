# Stack da VM secundária (papel "secondary", ADR 0005): só o Blocky, com a mesma
# configuração da principal (deploy/common/blocky). Porta pública: 53 (origem
# filtrada no host). Métricas (4000, 9100) só pela tailnet. Dimensionada para a BV1-1-10 (1 GB RAM + 1 GB swap).
name: mgdn

services:
  blocky:
    image: spx01/blocky:v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      # Métricas para o Prometheus da principal, pela tailnet. Na interface pública
      # a porta é descartada pelo nftables (scripts/allowlist.sh) e o SG não a abre.
      - "4000:4000/tcp"
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ../common/blocky/config.yml:/app/config.yml:ro
      - blocky-cache:/app/cache
      - blocky-logs:/logs
    mem_limit: 256m

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    ports:
      - "9100:9100/tcp"
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

volumes:
  blocky-cache:
  blocky-logs:
