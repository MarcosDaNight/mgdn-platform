# Stack da VM principal (papel "primary"). Portas públicas: 53 (DNS, origem filtrada
# no host) e 443 (Traefik: Headscale e apps da tailnet). UIs e APIs ficam em
# 127.0.0.1 e são acessadas pela tailnet (`make tunnel`). Limites de memória dimensionados para a BV2-2-10.
name: mgdn

services:
  headscale:
    image: headscale/headscale:0.29.6@sha256:cabe84f0699913dbca9320f0883dca7565dd08df3c5be29edfabbebeff763966
    restart: unless-stopped
    command: ["serve"]
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale
      - headscale-run:/var/run/headscale
    mem_limit: 128m

  traefik:
    image: traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    restart: unless-stopped
    ports:
      - "443:443/tcp"
    environment:
      # Token da Cloudflare (DNS-01), escrito pelo gitops-sync fora do repo.
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf-dns-token
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /etc/mgdn-platform/traefik:/run/secrets:ro
      - traefik-acme:/letsencrypt
    mem_limit: 128m

  vaultwarden:
    image: vaultwarden/server:1.37.4-alpine@sha256:19ea2b669945d842dadc3d500f2d6a795866a003330f59a47b9634658bae98bb
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.mgdn.com.br
      # Fechado depois da criação da conta do dono (ADR 0010).
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      PASSWORD_HINTS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      IP_HEADER: X-Forwarded-For
      LOG_LEVEL: warn
    volumes:
      - vaultwarden-data:/data
    mem_limit: 128m

  blocky:
    image: spx01/blocky:v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "127.0.0.1:4000:4000/tcp"
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ../common/blocky/config.yml:/app/config.yml:ro
      - blocky-cache:/app/cache
      - blocky-logs:/logs
    mem_limit: 384m

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 256m

  blackbox:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 64m

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # URL secreta do ntfy, escrita pelo gitops-sync a partir de ALERT_NTFY_URL.
      - /etc/mgdn-platform/alertmanager:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    mem_limit: 64m

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

  grafana:
    image: grafana/grafana:13.2.4-slim@sha256:e1b9840daaea5ebbe9ac585257ed88cf7ea569d28d5058231b0778f8898ef736
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      # Senha do admin gerada no bootstrap da VM (nunca versionada).
      - path: /etc/mgdn-platform/grafana.env
        required: false
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/blocky.json
      # A imagem slim baixa 18 plugins no boot (~500 MB no volume); só o datasource
      # Prometheus é usado. Ele é instalado antes do provisioning e os demais são
      # desativados (o que também os tira da lista de instalação).
      GF_PLUGINS_PREINSTALL_SYNC: prometheus
      GF_PLUGINS_DISABLE_PLUGINS: >-
        grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app,grafana-advisor-app,elasticsearch,tempo,zipkin,opentsdb,stackdriver,mssql,jaeger,loki,mysql,influxdb,grafana-postgresql-datasource,grafana-pyroscope-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # Medido: ~190 MB em uso ocioso; 192m deixava o Grafana no teto do cgroup.
    mem_limit: 320m

volumes:
  traefik-acme:
  vaultwarden-data:
  headscale-data:
  headscale-run:
  blocky-cache:
  blocky-logs:
  prometheus-data:
  grafana-data:
  alertmanager-data:
