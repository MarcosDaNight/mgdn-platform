# Stack da VM principal (papel "primary"). Portas públicas: 53 (DNS, origem filtrada
# no host) e 443 (Traefik: Headscale e apps da tailnet). UIs e APIs ficam em
# 127.0.0.1 e são acessadas pela tailnet (`make tunnel`). Limites de memória dimensionados para a BV2-4-10 (4 GB; orçamento de 3400 MB).
name: mgdn

services:
  headscale:
    image: headscale/headscale:v0.29.7@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
    restart: unless-stopped
    command: ["serve"]
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale
      - headscale-run:/var/run/headscale
    labels:
      # Contrato de app (ADR 0015): lido pelo backup, restore, healthcheck e DR drill.
      mgdn.backup.volume: headscale-data
      mgdn.backup.ready: db.sqlite
    # Pico medido (memory.peak, 7 dias): 40 MB; limite = 1,5x o pico.
    mem_limit: 64m

  traefik:
    image: traefik:v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
    restart: unless-stopped
    ports:
      - "443:443/tcp"
    environment:
      # Token da Cloudflare (DNS-01), escrito pelo gitops-sync fora do repo.
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf-dns-token
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /etc/mgdn-platform/traefik:/run/secrets:ro
      - traefik-acme:/letsencrypt
    labels:
      # Certificados: uma VM recriada volta com eles, sem gastar o limite do Let's Encrypt.
      mgdn.backup.volume: traefik-acme
      mgdn.backup.ready: acme.json
    mem_limit: 128m

  vaultwarden:
    image: vaultwarden/server:1.37.5-alpine@sha256:bbe684a02d6b0db54256ff88eac9754f4519284a7b26314afc241fd7d0918191
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.mgdn.com.br
      # Fechado depois da criação da conta do dono (ADR 0010).
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      PASSWORD_HINTS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      IP_HEADER: X-Forwarded-For
      LOG_LEVEL: warn
    volumes:
      - vaultwarden-data:/data
    labels:
      mgdn.url: https://vault.mgdn.com.br
      mgdn.port: "80"
      mgdn.health: /alive
      mgdn.backup.volume: vaultwarden-data
      mgdn.backup.ready: db.sqlite3
      mgdn.backup.exclude: icon_cache,tmp
      mgdn.summary: "db.sqlite3: select count(*) || ' usuário(s), ' || (select count(*) from ciphers) || ' item(ns)' from users"
    mem_limit: 128m

  # Finanças pessoais (ADR 0012), só pela tailnet. A senha do servidor é definida
  # no primeiro acesso; os dados ficam no volume e entram no backup horário.
  actual:
    image: actualbudget/actual-server:26.11.0-alpine@sha256:01ac24a51c6f585aba287c1bf1e96fcda46ab16a05952817c637415213251aa3
    restart: unless-stopped
    environment:
      ACTUAL_LOGIN_METHOD: password
      ACTUAL_ALLOWED_LOGIN_METHODS: password
    volumes:
      - actual-data:/data
    labels:
      mgdn.url: https://actual.mgdn.com.br
      mgdn.port: "5006"
      mgdn.health: /health
      mgdn.backup.volume: actual-data
      mgdn.backup.ready: server-files/account.sqlite
      mgdn.summary: "server-files/account.sqlite: select count(*) || ' orçamento(s)' from files"
    mem_limit: 256m

  blocky:
    image: spx01/blocky:v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "127.0.0.1:4000:4000/tcp"
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ../common/blocky/config.yml:/app/config.yml:ro
      - blocky-cache:/app/cache
      - blocky-logs:/logs
    # Pico medido (memory.peak, 7 dias, com o refresh das listas): 140 MB; limite = 1,5x o pico.
    mem_limit: 224m

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 256m

  blackbox:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    # Pico medido: 16 MB; limite = 1,5x o pico.
    mem_limit: 32m

  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # URL secreta do ntfy, escrita pelo gitops-sync a partir de ALERT_NTFY_URL.
      - /etc/mgdn-platform/alertmanager:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    mem_limit: 64m

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # Métricas do GitOps sync (scripts/gitops-sync.sh).
      - --collector.textfile.directory=/host/var/lib/mgdn-platform/metrics
    pid: host
    volumes:
      - /:/host:ro,rslave
    # Pico medido: 26 MB; limite = 1,5x o pico.
    mem_limit: 48m

  grafana:
    image: grafana/grafana:13.3.1-slim@sha256:49221b454a407632e47e6d4bbc2bb1585c462bf68c6fb9ebed4aa072b027595a
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      # Senha do admin gerada no bootstrap da VM (nunca versionada).
      - path: /etc/mgdn-platform/grafana.env
        required: false
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/blocky.json
      # A imagem slim baixa 18 plugins no boot (~500 MB no volume); só o datasource
      # Prometheus é usado. Ele é instalado antes do provisioning e os demais são
      # desativados (o que também os tira da lista de instalação).
      GF_PLUGINS_PREINSTALL_SYNC: prometheus
      GF_PLUGINS_DISABLE_PLUGINS: >-
        grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app,grafana-advisor-app,elasticsearch,tempo,zipkin,opentsdb,stackdriver,mssql,jaeger,loki,mysql,influxdb,grafana-postgresql-datasource,grafana-pyroscope-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # Medido: ~190 MB em uso ocioso; 192m deixava o Grafana no teto do cgroup.
    mem_limit: 320m

  # Gerado por `make new-app` (docs/adicionar-app.md). Só pela tailnet.
  freshrss:
    image: freshrss/freshrss:1.30.4-alpine@sha256:840765ea01fbaa1ea5b59f298878d224f62a4e83f8bba74d1a192ccd1d13669a
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      BASE_URL: https://freshrss.mgdn.com.br
      # Atualiza os feeds a cada 30 min (a imagem só agenda o cron com isto definido).
      CRON_MIN: "2,32"
      # A FreshRSS bloqueia pedidos a hosts internos. A extensão Webhook entrega os
      # avisos ao Alertmanager (que repassa ao ntfy com a URL secreta); só ele é liberado.
      INTERNAL_HOST_ALLOWLIST: alertmanager:9093
    volumes:
      - freshrss-data:/var/www/FreshRSS/data
      # Extensões oficiais fixadas por commit (extensions.lock), uma a uma: montar o
      # diretório inteiro esconderia as extensões que já vêm na imagem.
      - ./freshrss/extensions/xExtension-Webhook:/var/www/FreshRSS/extensions/xExtension-Webhook:ro
      - ./freshrss/extensions/xExtension-ReadingTime:/var/www/FreshRSS/extensions/xExtension-ReadingTime:ro
      - ./freshrss/extensions/xExtension-TitleWrap:/var/www/FreshRSS/extensions/xExtension-TitleWrap:ro
    labels:
      mgdn.url: https://freshrss.mgdn.com.br
      mgdn.port: "80"
      mgdn.health: /api/
      mgdn.backup.volume: freshrss-data
      mgdn.backup.ready: config.php
    # Estimado (ainda sem medição): ajustar com `docker stats` depois de alguns dias de uso.
    mem_limit: 128m

  # Timoneiro: app de estudo (CKA e Linux) com repetição espaçada, código em
  # github.com/MarcosDaNight/mgdn-study (ADR 0016). Só pela tailnet.
  estudo:
    image: ghcr.io/marcosdanight/mgdn-study:3653824ffd7d5c7d832ca8f55ac7a20b1bbf6752@sha256:fee8d51439f990cb9ba8f047710717ec4daf2a3d4a8ec0f245cd2f30ce59bbc4
    restart: unless-stopped
    environment:
      # Atrás do Traefik o Node só vê http://: sem ORIGIN, o SvelteKit rejeita os POSTs (CSRF).
      ORIGIN: https://estudo.mgdn.com.br
      TZ: America/Sao_Paulo
      # Sem limite o V8 deixa o heap crescer (pico de 138 MB sob carga); com ele, 93 MB.
      NODE_OPTIONS: --max-old-space-size=48 --max-semi-space-size=1
    volumes:
      - estudo-data:/data
    labels:
      mgdn.url: https://estudo.mgdn.com.br
      mgdn.port: "3000"
      mgdn.health: /healthz
      mgdn.backup.volume: estudo-data
      mgdn.backup.ready: study.sqlite
      mgdn.summary: "study.sqlite: select count(*) || ' item(ns) estudado(s), ' || (select count(*) from review) || ' revisão(ões)' from card"
    # Pico medido sob carga (700 requisições, heap limitado): 93 MB; limite = 1,5x o pico.
    mem_limit: 144m

volumes:
  traefik-acme:
  vaultwarden-data:
  actual-data:
  headscale-data:
  headscale-run:
  blocky-cache:
  blocky-logs:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  freshrss-data:
  estudo-data:
