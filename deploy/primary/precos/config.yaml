# Metas e lojas do monitor de preços (código: github.com/MarcosDaNight/mgdn-precos). Editar aqui é um PR só:
# o GitOps reinicia o serviço quando este diretório muda. `python -m precos check-config` valida no app.
# Metas e lojas do monitor. Edite à vontade: `python -m precos check-config` valida.
# Termos de uso vencem robots.txt: só lojas cujos termos não proíbem coleta automatizada
# (KaBuM, e o Mercado Livre pela API). Fast Shop, Magalu e Amazon ficam de fora de propósito.
timezone: America/Recife
user_agent: "mgdn-precos/0.1 (monitor pessoal de precos)"
request_delay_seconds: 5

schedule:
  collect_every_hours: 6
  burst:               # Black Friday: coleta de hora em hora (datas no fuso acima, inclusive)
    from: 2026-11-20
    to: 2026-12-01
    every_hours: 1
  summary_at: "09:00"

alerts:
  drop_pct: 8              # queda sobre a mediana dos últimos 14 dias
  drop_window_days: 14
  dedupe_hours: 24         # não repete produto+loja, salvo se o preço cair de novo
  min_history: 3           # observações anteriores para valer "novo mínimo" e "queda"
  installment_vs_pix_pct: 5  # parcelar se o sem juros custar até 5% a mais que o Pix

first_party_sellers:       # "vendido e entregue pela própria loja"
  kabum: ["kabum!", "kabum"]

defaults:
  forbidden: [usado, seminovo, recondicionado, "open box", importado, importada, "gift card", "pacote de melhoria"]

# Mercado Livre (API oficial, só Lojas Oficiais): cole o link do anúncio (MLB...) em `stores.mercadolivre`
# e valide com `python -m precos ml-check <url>` antes de deixar coletando.
products:
  - id: console
    name: Console Nintendo Switch 2 256 GB
    category: console
    required: ["switch 2", "console", "256"]
    forbidden: [bundle, kit, jogo, "mario kart", pokemon, zelda, "fc 27", "sports resort", edicao, anniversary]
    target: { pix: 3700, installment: 3800 }   # preço de rua, não o sugerido
    stores:
      kabum:
        - https://www.kabum.com.br/produto/777177/console-nintendo-switch-2-256gb-preto-azul-e-vermelho

  - id: pro-controller
    name: Nintendo Switch 2 Pro Controller (oficial)
