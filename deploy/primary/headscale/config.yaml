# Headscale: servidor de controle da tailnet (ADR 0003).
# Referência: https://github.com/juanfont/headscale/blob/v0.29.6/config-example.yaml

server_url: https://headscale.mgdn.com.br
# Atrás do Traefik (ADR 0010): HTTP interno, o TLS é terminado no proxy.
listen_addr: 0.0.0.0:8080
# Só na rede do compose (não publicado), para o Prometheus.
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

# O Traefik conecta pela rede do Docker; só dele os cabeçalhos X-Forwarded-* valem.
trusted_proxies:
  - 172.16.0.0/12

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# Sequencial: o primeiro nó registrado (a própria VM) recebe 100.64.0.1, que é o
# DNS da tailnet abaixo.
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# NAT traversal pelos DERPs públicos da Tailscale (só retransmitem WireGuard
# cifrado); sem DERP próprio e sem a porta 3478/udp.
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: true

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

# TLS no Traefik (ADR 0010).
tls_letsencrypt_hostname: ""
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

# Sem arquivo de política: todos os nós do único usuário se alcançam.
policy:
  mode: file
  path: ""

# Os Blockys são o DNS de toda a tailnet: bloqueio em qualquer rede. A principal
# (100.64.0.1) e a secundária em br-se1 (100.64.0.4, ADR 0005) bloqueiam igual.
dns:
  magic_dns: true
  base_domain: tail.mgdn
  override_local_dns: true
  nameservers:
    global:
      - 100.64.0.1
      - 100.64.0.4
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

taildrop:
  enabled: true
