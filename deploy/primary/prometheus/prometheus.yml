global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: blocky
    static_configs:
      - targets: ["blocky:4000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: headscale
    static_configs:
      - targets: ["headscale:9090"]
