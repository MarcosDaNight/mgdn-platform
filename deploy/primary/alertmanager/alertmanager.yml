# Alertas no celular via ntfy (ADR 0009). A URL do tópico é secreta e vem de um
# arquivo na VM (gerado pelo gitops-sync a partir de ALERT_NTFY_URL), nunca do repo.
route:
  receiver: ntfy
  group_by: [alertname, resolver]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Itens do FreshRSS (extensão Webhook, docs/freshrss.md): tópico próprio, uma mensagem
    # por item. Vem antes da rota `severity="info"` porque a primeira que casa vence.
    - receiver: ntfy-noticias
      matchers: ['source="freshrss"']
      group_by: [alertname, item]
      group_wait: 0s
      repeat_interval: 168h
    # Dead man's switch (ADR 0013): o Watchdog vai só para o healthchecks.io, a cada
    # minuto, e nunca chega ao celular (sem `continue`, a rota padrão não o recebe).
    - receiver: healthchecks
      matchers: ['alertname="Watchdog"']
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    # Avisos sem urgência (ex.: aparelho sumido da tailnet): celular, uma vez por semana.
    - receiver: ntfy
      matchers: ['severity="info"']
      group_by: [alertname, node]
      repeat_interval: 168h

receivers:
  - name: ntfy
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ntfy-url
        send_resolved: true
  # Tópico separado para os itens do FreshRSS (gerado pelo gitops-sync a partir de
  # ALERT_NEWS_NTFY_URL). Sem resolved: o item não "resolve", só expira em 5 min.
  - name: ntfy-noticias
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ntfy-noticias-url
        send_resolved: false
  # URL de ping do check (secreta), gerada pelo gitops-sync a partir de ALERT_WATCHDOG_URL.
  - name: healthchecks
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/watchdog-url
        send_resolved: false
