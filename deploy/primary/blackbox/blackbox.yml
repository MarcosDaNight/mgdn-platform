# Sondas DNS que alimentam o SLI (ADR 0009). Um Blocky só está "ok" se resolver E
# bloquear: responder sem bloquear também é falha para quem usa.
modules:
  dns_resolve:
    prober: dns
    timeout: 3s
    dns:
      query_name: cloudflare.com
      query_type: A
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - 'cloudflare\.com\.\s+\d+\s+IN\s+A\s+\d+\.\d+\.\d+\.\d+'
  dns_block:
    prober: dns
    timeout: 3s
    dns:
      query_name: pagead2.googlesyndication.com
      query_type: A
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - '\s+IN\s+A\s+0\.0\.0\.0$'
