name: dependabot-auto-merge

# Auto-merge de atualizações de PATCH do Dependabot (ADR 0011). O merge nativo do
# GitHub só acontece depois de todos os checks obrigatórios da main (testes, Trivy,
# terraform test); aí o GitOps aplica, com validação, rollback e alertas de SLO.
# Minor e major continuam com revisão manual.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Habilitar auto-merge (patch)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
          gh pr comment "$PR_URL" --body "🤖 Atualização de patch: auto-merge habilitado (entra quando todos os checks passarem)."

      - name: Revisão manual (minor/major)
        if: steps.meta.outputs.update-type != 'version-update:semver-patch'
        run: echo "::notice::${{ steps.meta.outputs.update-type }} — mantido para revisão manual."
