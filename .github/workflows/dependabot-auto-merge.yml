name: dependabot-auto-merge

# Auto-merge do Dependabot (ADR 0011): PATCH de tudo e MINOR de imagens de container.
# O merge nativo do GitHub só acontece depois de todos os checks obrigatórios da main
# (testes, Trivy, terraform test); aí o GitOps aplica, com validação, rollback e alertas
# de SLO e de host, e o healthcheck externo confere os apps. Major e minor de Actions e
# providers continuam com revisão manual.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - id: policy
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]] ||
             [[ "$UPDATE_TYPE" == "version-update:semver-minor" && "$ECOSYSTEM" == docker* ]]; then
            echo "auto=true" >>"$GITHUB_OUTPUT"
          else
            echo "auto=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Habilitar auto-merge
        if: steps.policy.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
          gh pr comment "$PR_URL" --body "🤖 ${UPDATE_TYPE#version-update:semver-}: auto-merge habilitado (entra quando todos os checks passarem)."

      - name: Revisão manual
        if: steps.policy.outputs.auto != 'true'
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: echo "::notice::$UPDATE_TYPE ($ECOSYSTEM) — mantido para revisão manual."
