name: ci

# Gate do GitOps: a VM só aplica o que está na main, e nada entra na main sem
# passar aqui. Os mesmos checks rodam de novo na VM antes de aplicar.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (provider simulado, sem credenciais)
        run: terraform test

  deploy-config:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        role: [primary, secondary]
    defaults:
      run:
        working-directory: deploy/${{ matrix.role }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose
        run: docker compose config --quiet
      - name: blocky validate
        run: docker compose run --rm --no-deps -T blocky validate
      - name: promtool check config
        if: hashFiles(format('deploy/{0}/prometheus/prometheus.yml', matrix.role)) != ''
        run: docker compose run --rm --no-deps -T --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - name: promtool test rules (SLO, GitOps, Watchdog, host, tailnet)
        if: hashFiles(format('deploy/{0}/prometheus/tests/slo_test.yml', matrix.role)) != ''
        run: docker compose run --rm --no-deps -T --entrypoint promtool -w /etc/prometheus/tests prometheus test rules slo_test.yml gitops_test.yml watchdog_test.yml host_test.yml tailnet_test.yml
      - name: amtool check-config
        if: hashFiles(format('deploy/{0}/alertmanager/alertmanager.yml', matrix.role)) != ''
        run: docker compose run --rm --no-deps -T --entrypoint amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
      # Dead man's switch (ADR 0013): o Watchdog vai só para o healthchecks.io, e os
      # alertas reais continuam indo para o celular.
      - name: amtool config routes test
        if: hashFiles(format('deploy/{0}/alertmanager/alertmanager.yml', matrix.role)) != ''
        run: |
          amtool() { docker compose run --rm --no-deps -T --entrypoint amtool alertmanager config routes test --config.file /etc/alertmanager/alertmanager.yml "$@"; }
          amtool --verify.receivers=healthchecks alertname=Watchdog
          amtool --verify.receivers=ntfy alertname=DNSErrorBudgetFastBurn severity=page
          amtool --verify.receivers=ntfy alertname=TailnetNodeStale severity=info
          if amtool --verify.receivers=ntfy alertname=Watchdog >/dev/null; then
            echo "::error::o Watchdog chegaria no celular"; exit 1
          fi
      - name: blackbox config check
        if: hashFiles(format('deploy/{0}/blackbox/blackbox.yml', matrix.role)) != ''
        run: docker compose run --rm --no-deps -T blackbox --config.file=/etc/blackbox/blackbox.yml --config.check
      # Contrato de app (ADR 0015): cada mgdn.url tem rota no Traefik e nome no Blocky.
      - name: contrato dos apps
        if: matrix.role == 'primary'
        run: python3 ../../scripts/apps.py --compose compose.yaml check
      # O gerador do `make new-app` produz um app que passa nas mesmas validações.
      - name: make new-app (numa cópia)
        if: matrix.role == 'primary'
        run: |
          t=$(mktemp -d)
          cp -r ../../deploy "$t/"
          python3 ../../scripts/new-app.py exemplo nginx:1.27-alpine@sha256:$(printf '0%.0s' {1..64}) 8080 --data /data --root "$t"
          docker compose -f "$t/deploy/primary/compose.yaml" config --quiet
          python3 ../../scripts/apps.py --compose "$t/deploy/primary/compose.yaml" check
          python3 ../../scripts/apps.py --compose "$t/deploy/primary/compose.yaml" backup | grep -q '^exemplo'
          docker compose -f "$t/deploy/primary/compose.yaml" run --rm --no-deps -T blocky validate
      - name: headscale configtest
        if: hashFiles(format('deploy/{0}/headscale/config.yaml', matrix.role)) != ''
        run: |
          image=$(docker compose config --format json | jq -r '.services.headscale.image')
          docker run --rm -v "$PWD/headscale/config.yaml:/etc/headscale/config.yaml:ro" \
            --tmpfs /var/lib/headscale --tmpfs /var/run/headscale "$image" configtest

  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: pipx run pre-commit run --all-files --show-diff-on-failure
      - name: política de retenção dos backups (autoteste)
        run: python3 scripts/retention.py --self-test
      # Chaves SSH dos hosts (ADR 0014): uma linha ed25519 por VM, com os três nomes
      # pelos quais o Makefile a acessa.
      - name: known_hosts das VMs
        run: |
          for h in mgdn-primary mgdn-secondary; do
            grep -qE "^$h,100\.64\.0\.[0-9]+,[0-9.]+ ssh-ed25519 AAAA" deploy/ssh/known_hosts || { echo "::error::$h ausente ou fora do formato em deploy/ssh/known_hosts"; exit 1; }
          done
          ssh-keygen -lf deploy/ssh/known_hosts
      - name: prazos (.github/deadlines.yml)
        run: python3 scripts/deadlines.py --check
      # ADR 0014: os segredos só entram cifrados, um destinatário por linha age1 do
      # .recipients (host + administração), e o formato aceito pela VM é conferido.
      - name: segredos cifrados
        run: |
          for r in primary secondary; do
            f=secrets/$r.env.age
            head -1 "$f" | grep -qx -- '-----BEGIN AGE ENCRYPTED FILE-----' || { echo "::error::$f não está cifrado"; exit 1; }
            want=$(grep -c '^age1' "secrets/$r.recipients")
            got=$(sed '1d;$d' "$f" | base64 -d | grep -ac '^-> X25519 ')
            [[ "$want" == "$got" ]] || { echo "::error::$f tem $got destinatário(s); secrets/$r.recipients lista $want"; exit 1; }
          done
          t=$(mktemp)
          printf "%s\n" "# ok" "A_URL='https://exemplo.net/x?y=1&z=2'" "HOME_DDNS_HOST=casa.exemplo.net" >"$t"
          scripts/secrets.sh check "$t"
          # Regressão: na VM (cloud-init e systemd) não há HOME, e o script roda com set -u.
          env -i PATH="$PATH" scripts/secrets.sh check "$t"
          for bad in 'X=$(id)' 'A_URL=http://inseguro' 'X=a b' 'HOME_DDNS_HOST=nao_e_host' 'SSH_HOST_ED25519_KEY_B64=xxx'; do
            printf '%s\n' "$bad" >"$t"
            if scripts/secrets.sh check "$t" 2>/dev/null; then echo "::error::check aceitou: $bad"; exit 1; fi
          done
