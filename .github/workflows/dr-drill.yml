name: dr-drill

# Restore drill mensal (ADR 0006): restaura o backup mais recente do Headscale num
# runner descartável, sobe o Headscale com ele, confere os nós e publica RTO/RPO
# medidos. Backup que nunca foi restaurado não prova nada.
#
# Secrets: BACKUP_RO_ACCESS_KEY / BACKUP_RO_SECRET_KEY (chave mgdn-backup-ro, só
# leitura) e BACKUP_AGE_IDENTITY (linha AGE-SECRET-KEY-... da chave privada).
on:
  schedule:
    - cron: "0 12 2 * *" # dia 2, 09:00 BRT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drill:
    runs-on: ubuntu-24.04
    env:
      BACKUP_ENDPOINT: https://br-se1.magaluobjects.com
      BACKUP_REGION: br-se1
      BACKUP_BUCKET: mgdn-platform-backup-b29a4ccd
      BACKUP_ACCESS_KEY: ${{ secrets.BACKUP_RO_ACCESS_KEY }}
      BACKUP_SECRET_KEY: ${{ secrets.BACKUP_RO_SECRET_KEY }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
      # Nós que precisam existir no banco restaurado.
      EXPECTED_NODES: mgdn-primary mgdn-secondary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ferramentas
        run: sudo apt-get install -y -qq age sqlite3 >/dev/null

      - name: Restore + Headscale de pé
        id: drill
        run: |
          set -euo pipefail
          t0=$(date +%s)
          data="$RUNNER_TEMP/headscale"
          vwdata="$RUNNER_TEMP/vaultwarden"
          restored=$(scripts/restore.sh --target "$data" --vw-target "$vwdata" | sed -n 's/^restored=//p')

          # Mesma config de produção, mas local: HTTP em 8080 e sem ACME.
          sed -e 's#^server_url: .*#server_url: http://127.0.0.1:8080#' \
              -e 's#^listen_addr: .*#listen_addr: 0.0.0.0:8080#' \
              -e 's#^tls_letsencrypt_hostname: .*#tls_letsencrypt_hostname: ""#' \
              deploy/primary/headscale/config.yaml > "$RUNNER_TEMP/config.yaml"
          image=$(docker compose -f deploy/primary/compose.yaml config --format json | jq -r '.services.headscale.image')
          docker run -d --name hs -p 127.0.0.1:8080:8080 \
            -v "$RUNNER_TEMP/config.yaml:/etc/headscale/config.yaml:ro" \
            -v "$data:/var/lib/headscale" "$image" serve >/dev/null
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/health && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/health

          nodes=$(docker exec hs headscale nodes list -o json | jq -r '.[].given_name' | sort | xargs)

          # Vaultwarden (ADR 0010): sobe o app com o backup e confere que responde.
          vw="ausente no backup"
          if [[ -f "$vwdata/db.sqlite3" ]]; then
            vwimage=$(docker compose -f deploy/primary/compose.yaml config --format json | jq -r '.services.vaultwarden.image')
            docker run -d --name vw -p 127.0.0.1:8081:80 -e DOMAIN=http://127.0.0.1:8081 -v "$vwdata:/data" "$vwimage" >/dev/null
            for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8081/alive && break; sleep 2; done
            curl -fsS -o /dev/null http://127.0.0.1:8081/alive
            vw="ok ($(sqlite3 "$vwdata/db.sqlite3" 'select count(*) from users;') usuário(s), $(sqlite3 "$vwdata/db.sqlite3" 'select count(*) from ciphers;') item(ns))"
          fi
          t1=$(date +%s)
          for n in $EXPECTED_NODES; do
            grep -qw "$n" <<<"$nodes" || { echo "::error::nó $n ausente no backup restaurado"; exit 1; }
          done

          # Rotação (ADR 0007): quantos backups existem e a idade do mais antigo.
          source scripts/s3.sh
          stamps=$(s3_list headscale/ | grep -oE '[0-9]{8}T[0-9]{6}Z' | sort)
          count=$(grep -c . <<<"$stamps")
          oldest=$(head -1 <<<"$stamps" | sed -E 's/(....)(..)(..)T(..)(..)(..)Z/\1-\2-\3 \4:\5:\6/')
          oldest_d=$(( ($(date +%s) - $(date -u -d "$oldest" +%s)) / 86400 ))
          [[ $oldest_d -le 400 ]] || { echo "::error::backup com $oldest_d dias: a rotação não está rodando"; exit 1; }

          # RPO: idade do backup restaurado (chave headscale/AAAAMMDDTHHMMSSZ...).
          stamp=$(basename "$restored" .tar.gz.age)
          backup_epoch=$(date -u -d "$(sed -E 's/(....)(..)(..)T(..)(..)(..)Z/\1-\2-\3 \4:\5:\6/' <<<"$stamp")" +%s)
          {
            echo "restored=$restored"
            echo "rto=$((t1 - t0))"
            echo "rpo_h=$(( (t1 - backup_epoch) / 3600 ))"
            echo "nodes=$nodes"
            echo "vaultwarden=$vw"
            echo "backups=$count (mais antigo: ${oldest_d} dias)"
          } >>"$GITHUB_OUTPUT"

      - name: Resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.drill.outcome }}
          RESTORED: ${{ steps.drill.outputs.restored }}
          RTO: ${{ steps.drill.outputs.rto }}
          RPO: ${{ steps.drill.outputs.rpo_h }}
          NODES: ${{ steps.drill.outputs.nodes }}
          BACKUPS: ${{ steps.drill.outputs.backups }}
          VAULTWARDEN: ${{ steps.drill.outputs.vaultwarden }}
        run: |
          month=$(TZ=America/Sao_Paulo date +%Y-%m)
          if [[ "$OUTCOME" == "success" ]]; then
            title="DR drill $month: OK (RTO ${RTO}s, RPO ${RPO}h)"
          else
            title="DR drill $month: FALHOU"
          fi
          body=$(printf '| | |\n|---|---|\n| Resultado | %s |\n| Backup restaurado | `%s` |\n| RTO (download → decifrar → Headscale e Vaultwarden respondendo) | %s s |\n| RPO (idade do backup) | %s h |\n| Nós no banco | %s |\n| Vaultwarden | %s |\n| Backups no bucket | %s |\n| Execução | %s |\n' \
            "$OUTCOME" "${RESTORED:-—}" "${RTO:-—}" "${RPO:-—}" "${NODES:-—}" "${VAULTWARDEN:-—}" "${BACKUPS:-—}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          echo "$body" >>"$GITHUB_STEP_SUMMARY"
          gh label create dr-drill --color 5319E7 --description "Restore drill mensal" --force >/dev/null
          url=$(gh issue create --title "$title" --body "$body" --label dr-drill --assignee "$GITHUB_REPOSITORY_OWNER")
          # Sucesso vira registro (issue fechada); falha fica aberta e notifica.
          [[ "$OUTCOME" != "success" ]] || gh issue close "$url" --reason completed >/dev/null
