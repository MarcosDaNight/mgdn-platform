# PRs de atualização. Com o CI verde e o merge na main, as VMs aplicam sozinhas.
version: 2
updates:
  - package-ecosystem: docker-compose
    directories: ["/deploy/primary", "/deploy/secondary"]
    schedule:
      interval: weekly
    groups:
      monitoring:
        patterns: ["prom/*", "grafana/*"]

  - package-ecosystem: terraform
    directories: ["/infra", "/infra/modules/host"]
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
